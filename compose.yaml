services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: arborseek_p0
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD in .env.deploy}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arborseek_p0"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  api:
    image: ${AGENT_IMAGE:-ask-course:local}
    build: .
    env_file: ${AGENT_ENV_FILE:-.env.deploy}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs:ro
      - model-cache:/app/model-cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m
    restart: unless-stopped
volumes:
  postgres-data:
  model-cache:
