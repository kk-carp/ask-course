<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>天树探界 · 售前助手（内部演示）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #17241f;
      --muted: #5b6b63;
      --paper: #e7efe4;
      --panel: #f6faf4;
      --canopy: #1b4f43;
      --moss: #2f6d59;
      --lidar: #b6d35a;
      --flag: #b54a28;
      --line: #c5d4c3;
      --shadow: 0 18px 40px rgba(23, 36, 31, 0.08);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(182, 211, 90, 0.18), transparent 55%),
        linear-gradient(180deg, #dce8d8 0%, var(--paper) 38%, #d4e0d2 100%);
      color: var(--ink);
      font-family: "Noto Sans SC", "PingFang SC", sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--moss); }
    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }
    .mast {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 22px;
    }
    .mark {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: var(--canopy);
      color: var(--lidar);
      display: grid;
      place-items: center;
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -1px;
    }
    .mast h1 {
      margin: 0;
      font-family: "Noto Serif SC", serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.4px;
      line-height: 1.2;
    }
    .mast p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
    .health {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .pill {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 12px;
      color: var(--muted);
    }
    .pill.ok { border-color: #8fb89a; color: var(--canopy); background: #eef7ee; }
    .pill.bad { border-color: #e2b4a4; color: var(--flag); background: #fbeee8; }
    .layout {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }
    .rail, .stage {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .rail { padding: 18px 16px 16px; }
    .rail h2, .drawer h3 {
      margin: 0 0 10px;
      font-family: "Noto Serif SC", serif;
      font-size: 16px;
    }
    .course-list { display: grid; gap: 8px; }
    .course {
      text-align: left;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--ink);
    }
    .course small { display: block; color: var(--muted); font-size: 12px; }
    .course[aria-pressed="true"] {
      border-color: var(--canopy);
      background: #e8f3ea;
      box-shadow: inset 3px 0 0 var(--lidar);
    }
    .hint { font-size: 12.5px; color: var(--muted); margin: 12px 0 0; }
    .stage {
      min-height: 640px;
      display: grid;
      grid-template-rows: 1fr auto auto;
    }
    .log {
      padding: 22px 22px 8px;
      overflow: auto;
      max-height: calc(100vh - 280px);
    }
    .empty {
      padding: 48px 8px 24px;
      color: var(--muted);
    }
    .empty strong {
      display: block;
      color: var(--ink);
      font-family: "Noto Serif SC", serif;
      font-size: 22px;
      margin-bottom: 8px;
    }
    .turn { margin: 0 0 18px; }
    .q, .a {
      border-radius: 14px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .q {
      margin-left: 18%;
      background: var(--canopy);
      color: #f4f8f2;
    }
    .a {
      margin-right: 8%;
      background: #fff;
      border: 1px solid var(--line);
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 10px;
      font-size: 12px;
    }
    .tag {
      border-radius: 999px;
      padding: 3px 9px;
      border: 1px solid var(--line);
      background: #fff;
    }
    .tag.hit { background: #eef6d8; border-color: #c7db86; color: #3d5a12; }
    .tag.miss { background: #fbeee8; border-color: #e2b4a4; color: var(--flag); }
    .related { display: grid; gap: 10px; margin-top: 10px; }
    .related b { font-size: 13px; }
    .related .course-card {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 10px;
      align-items: start;
      font-size: 13px;
      background: #f7f4ee;
      border-radius: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
    }
    .related .course-card.no-cover { grid-template-columns: 1fr; }
    .related .course-card img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
      background: #fff;
    }
    .related .course-card .card-body { display: grid; gap: 6px; }
    .related .course-card strong { font-size: 14px; }
    .related .course-card small { display: block; color: var(--muted); }
    .related .course-card .card-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .sources { display: grid; gap: 8px; margin-top: 10px; }
    .source {
      font-size: 13px;
      background: #f2f7f0;
      border-radius: 10px;
      padding: 8px 10px;
    }
    .source b { display: block; }
    .handoff {
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fff5ef;
      border-left: 4px solid var(--flag);
    }
    .handoff .who { font-family: "Noto Serif SC", serif; font-size: 16px; }
    .handoff .qr {
      display: block;
      width: 168px;
      height: 168px;
      margin-top: 10px;
      padding: 8px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      object-fit: contain;
    }
    .composer {
      border-top: 1px solid var(--line);
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      background: #fff;
      border-radius: 0 0 var(--radius) var(--radius);
    }
    textarea {
      width: 100%;
      min-height: 72px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: var(--panel);
    }
    textarea:focus, .course:focus-visible, button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(182, 211, 90, 0.7);
      outline-offset: 2px;
    }
    .send {
      align-self: end;
      min-width: 92px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: var(--canopy);
      color: #f7fbf5;
      font-weight: 700;
    }
    .send:disabled { opacity: 0.55; cursor: wait; }
    .prompts { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 12px; align-items: center; }
    .prompts button {
      height: 32px;
      border: 1px dashed var(--line);
      background: transparent;
      border-radius: 999px;
      padding: 0 12px;
      font-size: 12.5px;
      line-height: 32px;
      color: var(--muted);
      white-space: nowrap;
    }
    .drawer {
      margin-top: 14px;
      border-top: 1px dashed var(--line);
      padding-top: 12px;
    }
    .drawer label { display: block; font-size: 12.5px; color: var(--muted); margin: 8px 0 4px; }
    .drawer input[type="text"], .drawer input[type="password"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      background: #fff;
    }
    .row-actions { display: flex; gap: 8px; margin-top: 10px; }
    .ghost, .danger {
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
    }
    .ghost { border: 1px solid var(--line); background: #fff; }
    .danger { border: 0; background: var(--flag); color: #fff; }
    .docs { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
    .err { color: var(--flag); font-size: 13px; margin-top: 8px; }
    @media (max-width: 860px) {
      .layout, .mast { grid-template-columns: 1fr; }
      .health { justify-content: flex-start; }
      .q { margin-left: 8%; }
      .log { max-height: 52vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="mast">
      <div class="mark" aria-hidden="true">探</div>
      <div>
        <h1>售前助手内部演示</h1>
        <p>P0 只验证一件事：常规课咨能否在站内答上，答不上就转给对应售前。</p>
      </div>
      <div class="health" id="health" aria-live="polite"></div>
    </header>

    <div class="layout">
      <aside class="rail">
        <h2>当前课程</h2>
        <div class="course-list" id="courses"></div>
        <p class="hint">选课会把 <code>course_id</code> 带给接口，未命中时按课程精确转人工。游客提问无需登录。</p>

        <div class="drawer">
          <h3>内部维护</h3>
          <p class="hint" id="who">游客态 · 可提问，不能灌库</p>
          <form id="login-form">
            <label for="username">账号</label>
            <input id="username" name="username" value="p0_admin" autocomplete="username" />
            <label for="password">密码</label>
            <input id="password" name="password" type="password" value="demo1234" autocomplete="current-password" />
            <div class="row-actions">
              <button class="ghost" type="submit">登录</button>
              <button class="ghost" id="logout" type="button">退出</button>
            </div>
          </form>
          <form id="upload-form" hidden>
            <label for="file">上传课程文本（md / txt / pdf / docx / pptx）</label>
            <input id="file" name="file" type="file" accept=".md,.txt,.pdf,.docx,.pptx,text/markdown,text/plain" />
            <div class="row-actions">
              <button class="ghost" type="submit">入库到 courses</button>
            </div>
            <div class="docs" id="docs"></div>
          </form>
          <p class="err" id="admin-err" hidden></p>
        </div>
      </aside>

      <section class="stage">
        <div class="log" id="log">
          <div class="empty">
            <strong>还没有问过</strong>
            选一门课，用下面的例句，或直接输入学员常问的基础、适用人群、课时问题。知识库为空时会走到转人工，这也是 P0 要看的路径。
          </div>
        </div>
        <div class="prompts" id="prompts"></div>
        <form class="composer" id="ask-form">
          <textarea id="question" placeholder="这门课需要什么基础？" required></textarea>
          <button class="send" type="submit" id="send">提问</button>
        </form>
      </section>
    </div>
  </div>

  <script>
    const COURSES = [
      { id: "", name: "未指定课程", sub: "按官网课程列表自动匹配" },
      { id: "42", name: "课程 42", sub: "运营资料待确认" },
      { id: "43", name: "课程 43", sub: "运营资料待确认" },
      { id: "99", name: "课程 99", sub: "运营资料待确认" },
    ];

    const state = { courseId: "", conversationId: null, asking: false, me: null };
    const $ = (id) => document.getElementById(id);

    function escapeHtml(text) {
      return String(text ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function isImageContact(contact) {
      const value = String(contact || "").trim();
      if (!value) return false;
      try {
        const url = new URL(value, window.location.origin);
        if (url.protocol !== "http:" && url.protocol !== "https:") return false;
        return /\.(png|jpe?g|webp|gif|svg|bmp)$/i.test(url.pathname);
      } catch (_) {
        return false;
      }
    }

    function contactMarkup(contact) {
      const value = String(contact || "").trim();
      if (!isImageContact(value)) return /^https:\/\//.test(value) ? `<a href="${escapeHtml(value)}" target="_blank" rel="noopener noreferrer">联系课程顾问</a>` : "";
      const src = escapeHtml(value);
      return `<img class="qr" src="${src}" alt="企业微信二维码" data-contact="${src}" width="168" height="168" />`;
    }

    function renderCourses() {
      $("courses").innerHTML = COURSES.map((item) => `
        <button type="button" class="course" data-id="${item.id}" aria-pressed="${item.id === state.courseId}">
          ${escapeHtml(item.name)}
          <small>${escapeHtml(item.sub)}</small>
        </button>
      `).join("");
    }

    const DEFAULT_PROMPTS = [
      "推荐一门适合我的课程",
      "按我的基础帮我选课",
      "我想找课程顾问",
    ];

    function renderPrompts() {
      $("prompts").innerHTML = DEFAULT_PROMPTS.map((text) =>
        `<button type="button" data-q="${escapeHtml(text)}">${escapeHtml(text)}</button>`
      ).join("");
    }

    function setHealth(data, error) {
      if (error) {
        $("health").innerHTML = `<span class="pill bad">服务未就绪</span>`;
        return;
      }
      const item = (ok, label) => `<span class="pill ${ok ? "ok" : "bad"}">${label}${ok ? "正常" : "未就绪"}</span>`;
      $("health").innerHTML = [
        item(data.api, "接口"),
        item(data.database, "数据库"),
        item(data.embedding_loaded, "向量模型"),
      ].join("");
    }

    function setWho() {
      if (state.me) {
        $("who").textContent = `已登录 ${state.me.username} · 可灌库与改映射`;
        $("upload-form").hidden = !state.me.can_manage_documents;
      } else {
        $("who").textContent = "游客态 · 可提问，不能灌库";
        $("upload-form").hidden = true;
      }
    }

    function appendTurn(question) {
      const empty = $("log").querySelector(".empty");
      if (empty) empty.remove();
      const wrap = document.createElement("article");
      wrap.className = "turn";
      wrap.innerHTML = `
        <div class="q">${escapeHtml(question)}</div>
        <div class="meta-row"></div>
        <div class="a">正在检索课程知识库…</div>
      `;
      $("log").appendChild(wrap);
      wrap.scrollIntoView({ block: "end" });
      return wrap;
    }

    function paintTurn(wrap, payload, streamedText) {
      const hit = payload.hit;
      const answer = streamedText || payload.answer || "";
      const meta = wrap.querySelector(".meta-row");
      const tags = [];
      if (payload.intent === "multi_question") tags.push('<span class="tag">逐项回答</span>');
      if (hit === true) tags.push(`<span class="tag hit">${payload.intent === "course_info" ? "官网课程信息" : "有资料依据"}</span>`);
      if (hit === false && payload.intent === "recommend" && !(payload.related_courses || []).length) {
        tags.push('<span class="tag">选课咨询</span>');
      } else if (hit === false && payload.related_courses && payload.related_courses.length) {
        tags.push('<span class="tag hit">已匹配课程</span>');
      } else if (hit === false && (payload.intent === "content" || !payload.intent)) {
        tags.push(`<span class="tag miss">${payload.owner?.configured ? "课程顾问可协助" : "信息待确认"}</span>`);
      }
      if (payload.llm_called) tags.push('<span class="tag">已调用对话模型</span>');
      meta.innerHTML = tags.join("");
      let html = `<div>${escapeHtml(answer)}</div>`;
      if (payload.related_courses && payload.related_courses.length) {
        html += `<div class="related"><b>相关官网课程</b>${payload.related_courses.slice(0, 3).map((item) => {
          const detail = (item.source_url && /^https:\/\/www\.arborseek\.com\/course\/\d+\/?$/.test(item.source_url))
            ? item.source_url
            : (/^\d+$/.test(item.id || "") ? `https://www.arborseek.com/course/${item.id}` : "");
          const cover = item.cover_url && /^https:\/\//.test(item.cover_url)
            ? `<img src="${escapeHtml(item.cover_url)}" alt="" loading="lazy">`
            : "";
          const blurb = item.description
            ? `<small>${escapeHtml(item.description)}</small>`
            : "";
          const reason = item.reason ? `<small>推荐理由：${escapeHtml(item.reason)}</small>` : "";
          return `<div class="course-card${cover ? "" : " no-cover"}">${cover}<div class="card-body"><strong>${escapeHtml(item.title || "")}</strong>${blurb}${reason}<div class="card-actions">${detail ? `<a href="${escapeHtml(detail)}" target="_blank" rel="noopener noreferrer">查看官网课程详情</a>` : ""}${item.purchase_url ? `<button type="button" class="ghost" data-buy="${escapeHtml(item.id)}">去官网购买页</button>` : ""}</div></div></div>`;
        }).join("")}</div>`;
      }
      if (payload.sources && payload.sources.length) {
        html += `<div class="sources">${payload.sources.map((src) =>
          `<div class="source"><b>${escapeHtml(src.title || "来源")}</b>${escapeHtml(src.snippet || "")}</div>`
        ).join("")}</div>`;
      }
      if (payload.fact_sources?.length) html += `<div class="sources">${payload.fact_sources.map(src => `<div class="source">${src.status === "official" ? "官网实时信息" : "课程文字资料"} · 更新于 ${escapeHtml(src.updated_at?.slice(0, 10) || "")}</div>`).join("")}</div>`;
      const owner = payload.owner;
      const forceHandoff = ["advisor", "commercial", "multi_question"].includes(payload.intent);
      const matchedCourses = payload.related_courses && payload.related_courses.length;
      if (owner && (forceHandoff || (hit === false && !matchedCourses))) {
        if (owner.configured) {
          const note = isImageContact(owner.contact) ? "请扫描二维码联系顾问。" : "请打开联系方式联系顾问。";
          html += `<div class="handoff"><div class="who">${escapeHtml(owner.name || "课程顾问")}</div>
            <div>${escapeHtml(owner.topic_name || "")} · ${note}</div>
            ${contactMarkup(owner.contact)}</div>`;
        } else {
          html += `<div class="handoff"><div class="who">课程顾问联系方式暂不可用</div>
            <div>你可以先查看官网课程详情，或继续咨询已公开的课程信息。</div></div>`;
        }
      }
      if (payload.handoff_summary) html += `<div class="handoff"><button type="button" class="ghost" data-copy-summary="${escapeHtml(payload.handoff_summary)}">复制咨询摘要</button><pre>${escapeHtml(payload.handoff_summary)}</pre></div>`;
      wrap.querySelector(".a").innerHTML = html;
      const qr = wrap.querySelector(".handoff .qr");
      if (qr) {
        qr.addEventListener("error", () => {
          const fallback = document.createElement("div");
          if (payload.fallback_contact && /^https:\/\//.test(payload.fallback_contact)) {
            const link = document.createElement("a"); link.href = payload.fallback_contact;
            link.textContent = "二维码不可用，查看备用联系方式"; link.target = "_blank"; link.rel = "noopener noreferrer";
            fallback.append(link);
          } else fallback.textContent = "二维码暂不可用，请稍后重试。";
          qr.replaceWith(fallback);
        });
      }
    }

    async function readSse(response, onEvent) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let eventName = "message";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const chunks = buffer.split("\n\n");
        buffer = chunks.pop() || "";
        for (const chunk of chunks) {
          let data = "";
          for (const line of chunk.split("\n")) {
            if (line.startsWith("event:")) eventName = line.slice(6).trim();
            if (line.startsWith("data:")) data += line.slice(5).trim();
          }
          if (data) {
            let parsed;
            try { parsed = JSON.parse(data); } catch (_) { continue; }
            onEvent(eventName, parsed);
          }
          eventName = "message";
        }
      }
    }

    function appendRetry(wrap, question) {
      const retry = document.createElement("button"); retry.textContent = "重试本次提问";
      retry.type = "button"; retry.addEventListener("click", () => ask(question)); wrap.querySelector(".a").append(retry);
    }

    async function ask(question) {
      if (state.asking) return;
      state.asking = true;
      $("send").disabled = true;
      const wrap = appendTurn(question);
      const body = {
        question,
        channel: "internal_tool",
        course_id: state.courseId || null,
        conversation_id: state.conversationId,
      };
      let streamed = "";
      let latest = { hit: null, sources: [], owner: null };
      const parts = [];
      try {
        const res = await fetch("/ask/stream", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const detail = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(detail.detail || `提问失败（${res.status}）`);
        }
        await readSse(res, (name, data) => {
          if (name === "progress") wrap.querySelector(".a").textContent = data.message;
          if (name === "part") {
            parts[data.index - 1] = `${data.index}. ${data.question}\n${data.answer}`;
            streamed = parts.filter(Boolean).join("\n\n");
          }
          if (name === "meta") latest = { ...latest, ...data };
          if (name === "delta") streamed += data.text || "";
          if (name === "final") {
            streamed = "";
            latest = { ...latest, ...data };
            state.conversationId = data.conversation_id || state.conversationId;
          }
          if (name === "error") throw new Error(data.detail || "问答失败");
          if (name !== "progress") paintTurn(wrap, latest, streamed || latest.answer);
        });
        if (["upstream_error", "service_unavailable"].includes(latest.error_type)) appendRetry(wrap, question);
      } catch (err) {
        wrap.querySelector(".a").textContent = err.message || "提问失败";
        appendRetry(wrap, question);
      } finally {
        state.asking = false;
        $("send").disabled = false;
      }
    }

    async function refreshHealth() {
      try {
        const res = await fetch("/health", { credentials: "include" });
        setHealth(await res.json());
      } catch (err) {
        setHealth(null, err);
      }
    }

    async function refreshMe() {
      try {
        const res = await fetch("/me", { credentials: "include" });
        state.me = res.ok ? await res.json() : null;
      } catch (_) {
        state.me = null;
      }
      setWho();
      if (state.me?.can_manage_documents) refreshDocs();
    }

    async function refreshDocs() {
      const res = await fetch("/documents", { credentials: "include" });
      if (!res.ok) return;
      const items = await res.json();
      $("docs").innerHTML = items.length
        ? items.map((item) => `${escapeHtml(item.title)} · 课程 ${escapeHtml(item.course_id || "未标注")} · ${escapeHtml(item.status)} · ${item.chunk_count} 片`).join("<br>")
        : "课程空间还没有文档。";
    }

    function showAdminErr(message) {
      $("admin-err").hidden = !message;
      $("admin-err").textContent = message || "";
    }

    $("courses").addEventListener("click", (event) => {
      const btn = event.target.closest(".course");
      if (!btn) return;
      state.courseId = btn.dataset.id;
      renderCourses();
      renderPrompts();
    });
    $("log").addEventListener("click", async (event) => {
      const copy = event.target.closest("button[data-copy-summary]");
      if (copy) {
        try { await navigator.clipboard.writeText(copy.dataset.copySummary); copy.textContent = "已复制"; }
        catch (_) { copy.textContent = "复制失败，请手动选择摘要"; }
        return;
      }
      const target = event.target.closest("button[data-buy]");
      if (!target) return;
      target.disabled = true;
      try {
        const res = await fetch(`/courses/${encodeURIComponent(target.dataset.buy)}/purchase`, { credentials: "include" });
        if (!res.ok) throw new Error("课程购买入口暂不可用");
        const data = await res.json();
        const url = new URL(data.url);
        if (url.protocol !== "https:" || url.hostname !== "www.arborseek.com") throw new Error("课程购买地址无效");
        location.assign(url.href);
      } catch (err) { alert(err.message || "无法打开购买页"); }
      finally { target.disabled = false; }
    });
    $("prompts").addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-q]");
      if (!btn) return;
      const question = btn.dataset.q;
      if (!question) return;
      // 默认开场视为新选课，避免前端仍带着旧 conversation_id。
      if (DEFAULT_PROMPTS.includes(question)) {
        state.conversationId = null;
      }
      $("question").value = "";
      ask(question);
    });
    $("ask-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const question = $("question").value.trim();
      if (!question) return;
      $("question").value = "";
      ask(question);
    });
    $("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      showAdminErr("");
      const res = await fetch("/login", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: $("username").value,
          password: $("password").value,
        }),
      });
      if (!res.ok) {
        showAdminErr("登录失败，请确认账号密码。");
        return;
      }
      state.me = await res.json();
      setWho();
      refreshDocs();
    });
    $("logout").addEventListener("click", async () => {
      await fetch("/logout", { method: "POST", credentials: "include" });
      state.me = null;
      setWho();
    });
    $("upload-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = $("file").files[0];
      if (!file) { showAdminErr("先选择文件。"); return; }
      await ingestFile(file);
    });
    async function ingestFile(file, replace = false) {
      showAdminErr("");
      if (!state.courseId) { showAdminErr("请先选择要上传资料的课程 ID。"); return; }
      const data = new FormData();
      data.append("space", "courses");
      data.append("course_id", state.courseId);
      data.append("file", file);
      if (replace) data.append("replace", "true");
      const res = await fetch("/documents", { method: "POST", credentials: "include", body: data });
      if (!res.ok) {
        const detail = await res.json().catch(() => ({}));
        showAdminErr(typeof detail.detail === "string" ? detail.detail : "入库失败");
        return;
      }
      $("file").value = "";
      refreshDocs();
    }

    renderCourses();
    renderPrompts();
    refreshHealth();
    refreshMe();
    setInterval(refreshHealth, 15000);
  </script>
</body>
</html>
